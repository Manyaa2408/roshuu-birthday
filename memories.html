<!DOCTYPE html>
<html>
<head>
  <title>Our Memories 💕</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffe6f0;
      text-align: center;
      color: #b64b70;
    }

    h1 {
      margin-top: 30px;
      font-size: 36px;
    }

    p {
      font-size: 18px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .back {
      display: inline-block;
      margin: 20px;
      padding: 12px 25px;
      background: #ff5c8a;
      color: white;
      text-decoration: none;
      border-radius: 25px;
    }
  </style>
</head>

<body>

  <h1>Our Memories 💕</h1>
  <p>Some beautiful memories made together 🥰</p>

  <div class="gallery">

    <img src="WhatsApp Image 2026-08-18 at 12.04.52 AM.jpeg">
    <img src="WhatsApp Image 2026-08-18 at 12.04.52 AM (1).jpeg">
    <img src="WhatsApp Image 2026-08-18 at 12.04.53 AM.jpeg">
    <img src="WhatsApp Image 2026-08-18 at 12.04.53 AM (1).jpeg">
    <img src="WhatsApp Image 2026-08-18 at 12.04.54 AM.jpeg">
    <img src="WhatsApp Image 2026-08-18 at 12.04.54 AM (1).jpeg"> 
    
  </div>

  <a class="back" href="index.html">💗 Back to Birthday</a>

</body>
</html>
