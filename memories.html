<!DOCTYPE html>
<html>
<head>
  <title>Our Memories 💕</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffe6f0;
      text-align: center;
      color: #b64b70;
    }

    h1 {
      margin-top: 30px;
      font-size: 36px;
    }

    p {
      font-size: 18px;
    }

    .gallery {
    position: relative;
    width: 90%;
    max-width: 500px;
    height: 350px;
    margin: 40px auto;
    overflow: hidden;
}

    .gallery img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 350px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    opacity: 0;
    animation: memorySlide 28s infinite;
}

.gallery img:nth-child(1) {
    animation-delay: 0s;
}

.gallery img:nth-child(2) {
    animation-delay: 4s;
}

.gallery img:nth-child(3) {
    animation-delay: 8s;
}

.gallery img:nth-child(4) {
    animation-delay: 12s;
}

.gallery img:nth-child(5) {
    animation-delay: 16s;
}

.gallery img:nth-child(6) {
    animation-delay: 20s;
}

.gallery img:nth-child(7) {
    animation-delay: 24s;
}

@keyframes memorySlide {
    0% {
        opacity: 0;
    }
    3% {
        opacity: 1;
    }
    11% {
        opacity: 1;
    }
    14% {
        opacity: 0;
    }
    100% {
        opacity: 0;
    }
}

    .back {
      display: inline-block;
      margin: 20px;
      padding: 12px 25px;
      background: #ff5c8a;
      color: white;
      text-decoration: none;
      border-radius: 25px;
    }
  </style>
</head>

<body>

  <h1>Our Memories 💕</h1>
  <p>Some beautiful memories made together 🥰</p>

  <div class="gallery">

    <img src="WhatsApp Image 2026-08-18 at 12.04.52 AM.jpeg">
    <img src="WhatsApp Image 2026-08-18 at 12.04.52 AM (1).jpeg">
    <img src="WhatsApp Image 2026-08-18 at 12.04.53 AM.jpeg">
    <img src="WhatsApp Image 2026-08-18 at 12.04.53 AM (1).jpeg"> 
    <img src="WhatsApp Image 2026-08-18 at 12.04.54 AM.jpeg">
    <img src="WhatsApp Image 2026-08-18 at 12.04.51 AM.jpeg"> 
    <img src="WhatsApp Image 2026-08-18 at 12.04.53 AM (3).jpeg"> 
  </div>

<p>
  And these are just a few of my favourite memories with you, Roshuuu babyy. ❤️<br>
  Here’s to making a million more. 🥹✨
</p>

</body>
</html>
